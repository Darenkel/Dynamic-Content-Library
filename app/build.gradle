plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()

    // Fabric Loader and its Mixin/Gson dependents.
    maven {
        name = 'FabricMC'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava

    // Local jars required by the project.
    compileOnly files('src/libs/Sector Space.jar', 'src/libs/SSFML.jar')

    // Fabric Loader, sponge-mixin (brings the Mixin API) and ASM are exposed transitively at
    // compile time and are supplied at runtime by SSFML's bundled loader/launcher.
    compileOnly libs.fabric.loader
    compileOnly libs.sponge.mixin
    compileOnly libs.asm
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'dynamic.content.library.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
